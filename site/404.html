<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — barrito</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap">
<style>
:root{--bg:#131210;--ink:#f7f5ef;--dim:#b3ac9f;--faint:#8f887b;--line:#35322b;--orange:#ff8001;--cream:#f2e8d5;--cream-ink:#161310;--sans:"Geist",ui-sans-serif,system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;--funky:"Fraunces",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px}
a{color:inherit;text-decoration:none}
img{width:110px;height:auto;animation:bfloat 5s ease-in-out infinite;transition:transform .4s}
img:hover{transform:rotate(-5deg) scale(1.05)}
@keyframes bfloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){img{animation:none;transition:none}img:hover{transform:none}}
code{font-family:var(--mono);background:#191815;border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-size:.9em;color:var(--dim)}
h1{font-size:clamp(44px,10vw,80px);font-weight:400;letter-spacing:-.04em;line-height:1;margin:22px 0 0}
h1 em{font-family:var(--funky);font-style:italic;font-weight:600;color:var(--orange)}
p{color:var(--dim);max-width:38ch;margin:16px auto 0;line-height:1.6}
.cta{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 22px;margin-top:30px;font-weight:500;border-radius:100px;background:var(--orange);color:#131210}
.cta:hover{background:#ff962c}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;margin-top:30px;margin-left:10px;font-weight:500;border-radius:6px;border:1px solid var(--line);color:var(--dim)}
.btn:hover{color:var(--ink);border-color:var(--orange)}
.foot{position:absolute;bottom:20px;left:0;right:0;font-family:var(--mono);font-size:12px;color:var(--faint)}
</style>
</head>
<body>
<main>
  <img src="assets/logo-256.png" width="256" height="256" alt="barrito cartoon burrito mascot" decoding="async">
  <h1>404 — <em>nothing wrapped here.</em></h1>
  <p>This page fell off the tortilla. The router couldn't route you anywhere useful.</p>
  <p style="margin-top:10px">Try <code>barrito which</code> back on <code>127.0.0.1:4141</code>.</p>
  <a class="cta" href="index.html">Take me home</a>
  <a class="btn" href="https://github.com/tbarho/barrito">GitHub</a>
</main>
<p class="foot">barrito · MIT · one router, every identity</p>
</body>
</html>
